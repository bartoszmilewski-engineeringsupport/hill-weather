<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hill Weather: cloud base and inversions</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --ink: #16191d; --dim: #666e78;
    --line: #e2e5ea; --accent: #2f6f4f;
    --good: #2f6f4f; --mid: #b07d2b; --bad: #8a3d3d; --inv: #4a5fa8;
    --cloud: #c9ced6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171a; --card: #1c2024; --ink: #e8eaed; --dim: #9aa3ad;
      --line: #2a2f35; --accent: #7fc6a0;
      --good: #7fc6a0; --mid: #d9ac5f; --bad: #d98b8b; --inv: #93a6e8;
      --cloud: #3a424c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 0 0 3rem;
  }
  header { padding: 1.1rem 1rem .6rem; max-width: 780px; margin: 0 auto; }
  h1 { font-size: 1.15rem; margin: 0 0 .15rem; letter-spacing: -.01em; }
  .sub { color: var(--dim); font-size: .8rem; }
  .bar { display: flex; gap: .4rem; flex-wrap: wrap; padding: .5rem 1rem;
         max-width: 780px; margin: 0 auto; }
  button {
    font: inherit; font-size: .82rem; padding: .32rem .7rem; cursor: pointer;
    background: var(--card); color: var(--ink);
    border: 1px solid var(--line); border-radius: 999px;
  }
  button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent);
    color: var(--bg); font-weight: 600; }
  main { max-width: 720px; margin: 0 auto; padding: .3rem 1rem; }
  .row {
    display: grid; grid-template-columns: 2.9rem 1fr auto;
    gap: .8rem; align-items: center;
    border-bottom: 1px solid var(--line);
    padding: .5rem .35rem; cursor: pointer;
  }
  .row:hover { background: var(--card); }
  .pct { font-size: 1.15rem; font-weight: 650; text-align: right;
         font-variant-numeric: tabular-nums; line-height: 1.1; }
  .mid { min-width: 0; }
  .name { font-weight: 600; white-space: nowrap; overflow: hidden;
          text-overflow: ellipsis; }
  .ht { color: var(--dim); font-weight: 400; font-size: .85em; }
  .meta { color: var(--dim); font-size: .74rem; margin-top: .05rem;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .viz { display: flex; align-items: center; gap: .5rem; }
  .elev { flex: none; display: block; }
  .tags { display: flex; gap: .25rem; flex-direction: column; align-items: flex-end; }
  .tag { font-size: .62rem; padding: .05rem .35rem; border-radius: 4px;
         border: 1px solid currentColor; white-space: nowrap; }
  @media (max-width: 540px) { .elev { display: none; } }
  .t-inv { color: var(--inv); } .t-light { color: var(--mid); }
  .g { color: var(--good); } .m { color: var(--mid); } .b { color: var(--bad); }
  .detail { display: none; padding: .5rem .75rem .7rem; margin: -.3rem 0 .5rem;
    background: var(--card); border: 1px solid var(--line); border-top: 0;
    border-radius: 0 0 10px 10px; font-size: .8rem; }
  .detail.open { display: block; }
  .detail table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .detail th { text-align: left; color: var(--dim); font-weight: 500; font-size: .72rem; }
  .detail td, .detail th { padding: .14rem .3rem; border-bottom: 1px solid var(--line); }
  .sun { color: var(--dim); margin-bottom: .4rem; }
  footer { max-width: 780px; margin: 1.5rem auto 0; padding: 0 1rem;
           color: var(--dim); font-size: .72rem; }
  footer a { color: var(--dim); }
  .warn { background: var(--card); border: 1px solid var(--line);
          border-left: 3px solid var(--mid); padding: .5rem .7rem;
          border-radius: 6px; font-size: .78rem; margin-bottom: .7rem; }
  .band { display: flex; justify-content: space-between; align-items: baseline;
          gap: .5rem; margin: 1.1rem .2rem .35rem; padding-bottom: .25rem;
          border-bottom: 1px solid var(--line);
          font-size: .78rem; font-weight: 650; letter-spacing: .02em;
          text-transform: uppercase; }
  .band:first-child { margin-top: .2rem; }
  .band-note { font-weight: 400; text-transform: none; letter-spacing: 0;
               color: var(--dim); }
  .head-row { display: flex; justify-content: space-between; align-items: flex-start;
              gap: 1rem; }
  .share { flex: none; padding: .4rem .9rem; font-weight: 600; }
  .share:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header>
  <div class="head-row">
    <div>
      <h1>Hill Weather</h1>
      <div class="sub" id="stamp">loading…</div>
    </div>
    <button id="share" class="share" title="Save a picture of today's forecast">Share</button>
  </div>
</header>

<div class="bar" id="regions"></div>
<div class="bar" id="days"></div>
<div class="bar" id="sorts"></div>

<main>
  <div class="warn">
    Internal viewer. Forecast is <strong>unvalidated</strong>. The cloud-base
    method has not yet been checked against observations.
  </div>
  <div id="list"></div>
</main>

<footer>
  Planning aid only, not a substitute for
  <a href="https://www.mwis.org.uk">MWIS</a> or, in winter,
  <a href="https://www.sais.gov.uk">SAIS</a>.<br>
  Weather: <a href="https://open-meteo.com">Open-Meteo</a>, UK Met Office 2km model.
  Hills: <a href="https://www.hill-bagging.co.uk/dobih">DoBIH</a> v18.5, CC-BY-4.0.
</footer>

<script>
const state = { region: null, day: null, sort: 'view_pct', data: {}, open: null };

const cls = v => v >= 70 ? 'g' : v >= 35 ? 'm' : 'b';
const hhmm = iso => iso ? iso.slice(11, 16) : '-';
const compass = d => d == null ? '' :
  ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'][Math.round(d/22.5)%16];

const DATA = 'data/';
const detailCache = {};

// Hourly detail is fetched only when a hill is tapped, and cached. The summary
// alone is enough to render the whole ranked list.
async function loadDetail(region, slug) {
  const key = region + '/' + slug;
  if (!detailCache[key])
    detailCache[key] = (await fetch(`${DATA}${region}/hills/${slug}.json`)).json();
  return detailCache[key];
}

async function boot() {
  const index = await (await fetch(DATA + 'index.json')).json();
  for (const r of index.regions)
    state.data[r.region] = await (await fetch(DATA + r.summary)).json();

  state.region = index.regions[0].region;
  const first = state.data[state.region];
  document.getElementById('stamp').textContent =
    'forecast ' + first.meta.forecast_fetched_utc.replace('T', ' ').slice(0, 16) +
    ' UTC · ' + first.meta.model;

  chips('regions', index.regions.map(r => [r.region, r.label]),
        () => state.region, v => { state.region = v; state.day = null; render(); });
  chips('sorts', [['view_pct', 'Chance of a view'], ['inversion', 'Inversion'],
                  ['light_dawn', 'Sunrise light']],
        () => state.sort, v => { state.sort = v; render(); });
  render();
}

function chips(id, items, get, set) {
  const el = document.getElementById(id);
  el.innerHTML = '';
  for (const [val, label] of items) {
    const b = document.createElement('button');
    b.textContent = label;
    b.setAttribute('aria-pressed', get() === val);
    b.onclick = () => { set(val); };
    el.appendChild(b);
  }
}

function render() {
  const d = state.data[state.region];
  const days = Object.keys(d.hills[0].daily).sort();
  if (!state.day || !days.includes(state.day)) state.day = days[0];

  chips('regions', Object.entries(state.data).map(([k, v]) => [k, v.meta.label]),
        () => state.region, v => { state.region = v; state.day = null; render(); });
  chips('days', days.map(x => [x, new Date(x + 'T12:00')
        .toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' })]),
        () => state.day, v => { state.day = v; render(); });
  chips('sorts', [['view_pct', 'Chance of a view'], ['inversion', 'Inversion'],
                  ['light_dawn', 'Sunrise light']],
        () => state.sort, v => { state.sort = v; render(); });

  const rows = d.hills
    .map(h => ({ h, s: h.daily[state.day] || {} }))
    .filter(r => r.s.view_pct != null)
    .sort((a, b) => (b.s[state.sort] || 0) - (a.s[state.sort] || 0)
                 || b.h.height - a.h.height);

  const list = document.getElementById('list');
  list.innerHTML = '';

  // Grouped by height band rather than one flat ranking. Sorting the whole
  // region by chance of a view puts the smallest fells on top, because they
  // sit below the cloud. That is arithmetically right and practically useless:
  // nobody drives to the Lakes for a 335m fell. Banding tells the real story,
  // which is usually "the tops are in cloud but the low fells are clear".
  const bands = (d.meta.bands || [[0, 'All hills']]);
  for (const [floor, label] of bands) {
    const inBand = rows.filter(r => r.h.height >= floor &&
      !bands.some(([f]) => f > floor && r.h.height >= f));
    if (!inBand.length) continue;

    const clear = inBand.filter(r => r.s.view_pct >= 70).length;
    const best = Math.max(...inBand.map(r => r.s.view_pct));
    const head = document.createElement('div');
    head.className = 'band';
    head.innerHTML = `<span>${label}</span><span class="band-note">${
      clear ? `${clear} of ${inBand.length} clear`
            : `none clear, best ${best}%`}</span>`;
    list.appendChild(head);

    renderRows(inBand, list);
  }
}

// A small elevation diagram: the cloud layer as a band, the summit as a tick.
//
// This is the whole idea of the site in one glyph. "CLEAR, cloud 850-1549m" is
// a sentence you have to parse; a summit sitting below a grey band is a fact
// you take in at a glance, and it makes rows comparable down the page in a way
// numbers never are.
const SCALE_TOP = 1600;   // metres at the right hand edge

function elevationBar(height, base, top, verdict) {
  const W = 132, H = 16;
  const x = m => Math.max(0, Math.min(W, (m / SCALE_TOP) * W));
  const parts = [];

  parts.push(`<rect x="0" y="${H / 2 - 1}" width="${W}" height="2"
    fill="var(--line)"/>`);

  if (base != null) {
    const b = x(base);
    const t = top != null ? x(top) : W;
    parts.push(`<rect x="${b}" y="0" width="${Math.max(2, t - b)}" height="${H}"
      fill="var(--cloud)" rx="2"/>`);
  }

  const sx = x(height);
  const colour = verdict === 'IN CLOUD' ? 'var(--bad)'
               : verdict === 'ON THE EDGE' ? 'var(--mid)' : 'var(--good)';
  parts.push(`<path d="M${sx - 5} ${H} L${sx} ${H - 11} L${sx + 5} ${H} Z"
    fill="${colour}"/>`);

  return `<svg class="elev" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"
    aria-hidden="true">${parts.join('')}</svg>`;
}

function renderRows(rows, list) {
  for (const { h, s } of rows) {
    const cloud = s.cloud_base == null ? 'no low cloud'
      : `cloud ${s.cloud_base}${s.cloud_top ? '-' + s.cloud_top : ''}m`;

    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <div class="pct ${cls(s.view_pct)}">${s.view_pct}<span style="font-size:.6em">%</span></div>
      <div class="mid">
        <div class="name">${h.name} <span class="ht">${h.height}m</span></div>
        <div class="meta">${cloud}${
          s.view_best !== s.view_worst
            ? ` · ${s.view_worst}-${s.view_best}% through the day` : ''}</div>
      </div>
      <div class="viz">
        ${elevationBar(h.height, s.cloud_base, s.cloud_top, s.verdict)}
        <div class="tags">
          ${s.inversion > 15 ? `<span class="tag t-inv">inversion</span>` : ''}
          ${s.light_dawn > 25 ? `<span class="tag t-light">dawn light</span>` : ''}
        </div>
      </div>`;

    const det = document.createElement('div');
    det.className = 'detail';
    det.textContent = 'loading…';

    row.onclick = async () => {
      const isOpen = det.classList.toggle('open');
      if (!isOpen) return;
      const full = await loadDetail(state.region, h.slug);
      det.innerHTML = detailHTML(full, full.sun[state.day] || {});
    };
    list.append(row, det);
  }
}

function detailHTML(h, sun) {
  const hrs = h.hours.filter(x => x.t.startsWith(state.day)
    && +x.t.slice(11, 13) >= 5 && +x.t.slice(11, 13) <= 21);
  return `
    <div class="sun">
      sunrise ${hhmm(sun.sunrise)} (${compass(sun.sunrise_azimuth)} ${sun.sunrise_azimuth ?? ''}°)
      · sunset ${hhmm(sun.sunset)} (${compass(sun.sunset_azimuth)})
      · ${sun.daylight_hours ?? '-'} h daylight
    </div>
    <table>
      <tr><th>h</th><th>view</th><th>cloud</th><th>temp</th><th>wind</th><th>inv</th><th>light</th></tr>
      ${hrs.map(x => `<tr>
        <td>${x.t.slice(11, 16)}</td>
        <td class="${cls(x.view_pct)}">${x.view_pct}%</td>
        <td>${x.cloud_base ?? '-'}${x.cloud_top ? '-' + x.cloud_top : ''}m${x.uncertain ? ' ?' : ''}</td>
        <td>${x.temp ?? '-'}°</td>
        <td>${x.wind ?? '-'} ${compass(x.wind_dir)}</td>
        <td>${x.inversion || ''}</td>
        <td>${x.light || ''}</td>
      </tr>`).join('')}
    </table>`;
}

// ---------------------------------------------------------------------------
// Share card.
//
// The growth model for this site is somebody pasting a picture into a walking
// group on a Friday night, so the card IS the marketing. It is drawn on a
// canvas rather than screenshotted so it always says where it came from and
// which day it is for, and so it reads the same in a chat thread whatever
// theme the sender happens to be using.
// ---------------------------------------------------------------------------

const CARD = {
  // Portrait rather than square. Four height bands with a few hills each does
  // not fit in 1080 square, and the alternative was silently dropping bands,
  // which could hide the only band that is actually clear.
  w: 1080, h: 1350,
  bg: '#14171a', card: '#1c2024', ink: '#e8eaed', dim: '#9aa3ad',
  line: '#2a2f35', good: '#7fc6a0', mid: '#d9ac5f', bad: '#d98b8b',
  inv: '#93a6e8',
  font: '-apple-system, "Segoe UI", system-ui, sans-serif',
};

function cardColour(v) {
  return v >= 70 ? CARD.good : v >= 35 ? CARD.mid : CARD.bad;
}

function drawCard() {
  const d = state.data[state.region];
  const c = document.createElement('canvas');
  c.width = CARD.w; c.height = CARD.h;
  const x = c.getContext('2d');

  x.fillStyle = CARD.bg;
  x.fillRect(0, 0, CARD.w, CARD.h);

  const pad = 72;
  let y = 108;

  x.fillStyle = CARD.ink;
  x.font = `700 58px ${CARD.font}`;
  x.fillText('Hill Weather', pad, y);

  x.fillStyle = CARD.dim;
  x.font = `400 30px ${CARD.font}`;
  y += 46;
  const day = new Date(state.day + 'T12:00').toLocaleDateString('en-GB',
    { weekday: 'long', day: 'numeric', month: 'long' });
  x.fillText(`${d.meta.label} · ${day}`, pad, y);

  // Rows, grouped exactly as the page groups them, so the card tells the same
  // story the site does rather than a flattened version of it.
  const rows = d.hills
    .map(h => ({ h, s: h.daily[state.day] || {} }))
    .filter(r => r.s.view_pct != null)
    .sort((a, b) => b.s.view_pct - a.s.view_pct || b.h.height - a.h.height);

  const bands = d.meta.bands || [[0, 'All hills']];
  y += 74;

  // Work out how many hills each band can show BEFORE drawing anything, so
  // every band that has hills always appears. Dropping bands when space runs
  // out would be the worst possible failure here: on a bad day the low band is
  // the only one with anything clear in it, and that is the whole message.
  const populated = bands.filter(([floor]) => rows.some(r =>
    r.h.height >= floor && !bands.some(([f]) => f > floor && r.h.height >= f)));
  const FOOTER_Y = CARD.h - 200;
  const BAND_CHROME = 90;          // header, rule and trailing gap
  const ROW_H = 50;
  const perBand = (FOOTER_Y - y) / Math.max(1, populated.length);
  const rowsPerBand = Math.max(1, Math.min(3,
    Math.floor((perBand - BAND_CHROME) / ROW_H)));

  for (const [floor, label] of bands) {
    const inBand = rows.filter(r => r.h.height >= floor &&
      !bands.some(([f]) => f > floor && r.h.height >= f));
    if (!inBand.length) continue;

    const clear = inBand.filter(r => r.s.view_pct >= 70).length;
    x.fillStyle = CARD.dim;
    x.font = `600 26px ${CARD.font}`;
    x.fillText(label.toUpperCase(), pad, y);
    x.textAlign = 'right';
    x.fillText(clear ? `${clear} of ${inBand.length} clear` : 'none clear',
               CARD.w - pad, y);
    x.textAlign = 'left';

    y += 14;
    x.strokeStyle = CARD.line; x.lineWidth = 2;
    x.beginPath(); x.moveTo(pad, y); x.lineTo(CARD.w - pad, y); x.stroke();
    y += 46;

    for (const { h, s } of inBand.slice(0, rowsPerBand)) {

      // Right hand side first, so we know how much room the name has left.
      const pct = `${s.view_pct}%`;
      x.font = `700 38px ${CARD.font}`;
      const pctW = x.measureText(pct).width;
      x.fillStyle = cardColour(s.view_pct);
      x.textAlign = 'right';
      x.fillText(pct, CARD.w - pad, y);
      x.textAlign = 'left';

      const height = `${h.height}m`;
      x.font = `400 26px ${CARD.font}`;
      const heightW = x.measureText(height).width;

      // Truncate the name to whatever is genuinely left rather than guessing a
      // character count: "An Teallach - Bidein a' Ghlas Thuill" is real.
      const room = CARD.w - pad * 2 - pctW - heightW - 60;
      x.font = `500 34px ${CARD.font}`;
      let name = h.name;
      while (x.measureText(name).width > room && name.length > 4) {
        name = name.slice(0, -2);
      }
      if (name !== h.name) name = name.trimEnd() + '…';
      x.fillStyle = CARD.ink;
      x.fillText(name, pad, y);
      const nameW = x.measureText(name).width;

      x.fillStyle = CARD.dim;
      x.font = `400 26px ${CARD.font}`;
      x.fillText(height, pad + nameW + 18, y);

      y += ROW_H;
    }
    y += 30;
  }

  // Inversions are the reason anyone forwards this, so they get called out.
  const best = rows.reduce((a, r) =>
    (r.s.inversion || 0) > (a?.s.inversion || 0) ? r : a, null);
  if (best && best.s.inversion >= 25) {
    x.fillStyle = CARD.inv;
    x.font = `600 30px ${CARD.font}`;
    x.fillText(`Possible inversion: ${best.h.name}`, pad, CARD.h - 190);
  }

  x.strokeStyle = CARD.line;
  x.beginPath(); x.moveTo(pad, CARD.h - 150); x.lineTo(CARD.w - pad, CARD.h - 150);
  x.stroke();

  x.fillStyle = CARD.ink;
  x.font = `600 32px ${CARD.font}`;
  x.fillText('hillweather.co.uk', pad, CARD.h - 96);
  x.fillStyle = CARD.dim;
  x.font = `400 24px ${CARD.font}`;
  x.fillText('Chance of a view from the summit. Planning aid, not a forecast service.',
             pad, CARD.h - 58);

  return c;
}

async function share() {
  const btn = document.getElementById('share');
  btn.disabled = true;
  btn.textContent = '…';
  try {
    const canvas = drawCard();
    const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
    const name = `hillweather-${state.region}-${state.day}.png`;
    const file = new File([blob], name, { type: 'image/png' });

    // Phones get the real share sheet, which is where this actually gets used.
    // Everything else falls back to a download.
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file] });
    } else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    }
  } catch (e) {
    if (e.name !== 'AbortError') console.error('share failed', e);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Share';
  }
}

document.getElementById('share').onclick = share;

boot().catch(e => document.getElementById('list').textContent =
  'Failed to load: ' + e + ': serve over http, not file://');
</script>
</body>
</html>
