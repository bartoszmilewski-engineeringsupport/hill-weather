# Hill Weather. The whole system in one stack, so it moves between hosts
# without anything being left behind.
#
# Two containers, both stock images, no build step:
#   web         nginx:alpine serving static files
#   scheduler   python:alpine running deploy/scheduler.py
#
# Everything host-specific lives in .env. Nothing is hardcoded to a particular
# VPS, path or port, so moving to a different provider or onto the homelab is
# a config change rather than a code change.
#
# Migration is: clone the repo, copy .env, restore archive/, compose up.

name: hillweather

services:
  web:
    image: nginx:alpine
    container_name: hillweather-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5003}:80"
    volumes:
      - ${PROJECT_ROOT:-..}/web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/data/_status.json"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  scheduler:
    image: python:3.12-alpine
    container_name: hillweather-scheduler
    restart: unless-stopped
    working_dir: /app
    command: ["python3", "/app/deploy/scheduler.py"]
    environment:
      ROOT: /app
      RUN_TIMES: "${RUN_TIMES:-05:15,16:15}"
      RUN_ON_START: "${RUN_ON_START:-1}"
      PYTHONUNBUFFERED: "1"
    volumes:
      # The repo itself, writable because the scheduler writes web/data.
      - ${PROJECT_ROOT:-..}:/app
      # Archive is mounted separately so it can live somewhere else entirely,
      # for example straight onto the NAS when running on the homelab.
      - ${ARCHIVE_DIR:-../archive}:/app/archive
    logging: *logging
