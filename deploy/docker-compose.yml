# Hill Weather - static site container.
#
# Follows the same pattern as the other static sites on the IONOS VPS
# (PPM Website :5001, GaugeApp :5002). Nginx Proxy Manager terminates SSL and
# routes hillweather.uk here; this container only ever serves files.
#
#   /opt/hillweather/
#     web/            <- docroot, contains data/ written by the build
#     scripts/        <- pipeline (runs on the host via cron, not in here)
#     archive/        <- raw forecast history
#     deploy/         <- this file
#
# NPM proxy host:  hillweather.uk -> http://<vps-ip>:5003   (Let's Encrypt on)

services:
  hillweather:
    image: nginx:alpine
    container_name: hillweather
    restart: unless-stopped
    ports:
      - "5003:80"
    volumes:
      - ../web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/data/index.json"]
      interval: 60s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
