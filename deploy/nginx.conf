# Static serving for Hill Weather.
#
# Two things matter here. First, gzip: the JSON is highly compressible - a
# 175 kB summary goes to roughly 30 kB - and this is an app people open on one
# bar of signal in a car park. Second, cache headers: the forecast is rebuilt
# twice a day, so a short cache is right for the data and a long one for the
# shell.

# www redirects to the canonical apex.
#
# Both hostnames answered 200 with identical content, which splits ranking
# signals between them and leaves Google to pick which one to show. The pages
# already carry a canonical tag pointing at the apex, but that is a hint the
# crawler may take; a 301 settles it at the HTTP level.
#
# This block matches the www hosts by exact name and nothing else. Everything
# else, the apex included, belongs to the default_server block below.
server {
    listen 80;
    server_name www.hillweather.co.uk www.hillweather.uk;
    return 301 https://hillweather.co.uk$request_uri;
}

server {
    # default_server, not just first-in-file. "server_name _" is NOT a
    # catch-all: it is a name that matches no real host. This block only ever
    # caught everything because it was the first block on port 80, so adding
    # a server block above it silently stole the default and sent the apex
    # into a redirect loop. Marking it explicitly makes order irrelevant.
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_types application/json application/javascript text/css text/plain
               image/svg+xml application/manifest+json;

    # Forecast data. Rebuilt twice daily, so half an hour of caching keeps the
    # CDN and the phone quiet without ever showing badly stale numbers.
    location /data/ {
        add_header Cache-Control "public, max-age=1800, stale-while-revalidate=3600";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # HTML must never be stale: it is small, revalidation is cheap, and a
    # stale page against fresh assets is the worst of both.
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Stylesheets and scripts. Without an explicit header Cloudflare applies
    # its own default of several hours to these extensions, which meant a CSS
    # change shipped alongside new markup left the site serving old styles
    # against a new page: giant icons, unstyled controls, broken layout. Five
    # minutes is short enough that a deploy lands almost immediately, and
    # stale-while-revalidate means nobody ever waits for the fetch.
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=300, stale-while-revalidate=86400";
    }

    # Images and icons genuinely do not change often.
    location ~* \.(png|jpg|jpeg|svg|webp|ico|woff2)$ {
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
    }

    # The contact handler. Never cached, and the only dynamic path on the site.
    location /api/ {
        proxy_pass http://contact:5010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store";
    }

    # A real 404, not the front page.
    #
    # This used to fall back to /index.html, which returned the whole site with
    # HTTP 200 for every address that does not exist. Search engines read that
    # as an unlimited supply of duplicate pages, all of them 200, which is the
    # classic soft 404 and it costs ranking. The site routes on the URL hash,
    # never on the path, so the fallback bought nothing.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "public, max-age=300";
    }

    # Crawler files: small, and cheap to revalidate.
    location = /robots.txt { add_header Cache-Control "public, max-age=3600"; }
    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; }

    # No directory listings, and nothing outside the docroot.
    autoindex off;
    location ~ /\. { deny all; }
}
