# Static serving for Hill Weather.
#
# Two things matter here. First, gzip: the JSON is highly compressible - a
# 175 kB summary goes to roughly 30 kB - and this is an app people open on one
# bar of signal in a car park. Second, cache headers: the forecast is rebuilt
# twice a day, so a short cache is right for the data and a long one for the
# shell.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_types application/json application/javascript text/css text/plain
               image/svg+xml application/manifest+json;

    # Forecast data. Rebuilt twice daily, so half an hour of caching keeps the
    # CDN and the phone quiet without ever showing badly stale numbers.
    location /data/ {
        add_header Cache-Control "public, max-age=1800, stale-while-revalidate=3600";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # The page shell changes rarely but must never be stale when it does -
    # revalidation is cheap because the file is small.
    location = /index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # No directory listings, and nothing outside the docroot.
    autoindex off;
    location ~ /\. { deny all; }
}
